<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gabriel Knight | Digital Card</title>
    <meta name="theme-color" content="#0f1412">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { 
            --bg-dark: #0f1412; 
            --gold: #dac386; 
            --white: #ffffff; 
            --olive: #847c57; 
            --base-glow: #1d2523;
            --glass: rgba(218, 195, 134, 0.08); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, var(--base-glow), var(--bg-dark));
        }

        .particle {
            position: absolute;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 6px var(--gold);
        }

        @keyframes floatDust {
            0% { transform: translateY(10vh); opacity: 0; }
            20%,80% { opacity: 0.6; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            border: 1px solid rgba(218,195,134,0.3);
            padding: 22px 20px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            text-align: center;
        }

        .main-logo {
            width: 220px;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 9px;
            color: var(--gold);
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            margin: 10px 0 2px;
        }

        .stars-container {
            margin-bottom: 10px;
            color: var(--gold);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .btn-outline {
            background: rgba(255,255,255,0.03);
            color: white;
            border: 1px solid var(--olive);
        }

        .btn-save {
            background: white;
            color: black;
        }

        .footer {
            margin-top: 15px;
            font-size: 9px;
            color: var(--olive);
        }
    </style>
</head>

<body>
<div id="bg-canvas"></div>

<div class="card">

    <img src="https://raw.githubusercontent.com/theknightlyphotobooth/Images-/194d47a8ad24d9fef8e9d6f9c3a28f9fad5fc1e5/the%20knightly%20logo.png"
         class="main-logo"
         alt="Knightly Photo Booth Logo">

    <div class="tagline">Luxury Photo Booths</div>

    <div class="user-name">Gabriel Knight</div>

    <div class="stars-container">★★★★★</div>

    <button onclick="generateVCard()" class="btn btn-save">Save Contact</button>

    <button onclick="handleNav('tel:+61422730144')" class="btn btn-outline">Call</button>
    <button onclick="handleNav('sms:+61422730144')" class="btn btn-outline">SMS</button>
    <button onclick="sendEmail()" class="btn btn-outline">Email</button>

    <div class="footer">Melbourne • Victoria • Australia</div>
</div>

<script>
    function handleNav(url) {
        window.open(url, '_blank');
    }

    function sendEmail() {
        window.location.href = "mailto:hello@knightlyphotobooth.com.au";
    }

    function createParticles() {
        const container = document.getElementById('bg-canvas');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = p.style.height = (Math.random() * 2 + 1) + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animation = 'floatDust ' + (Math.random() * 5 + 5) + 's linear infinite';
            container.appendChild(p);
        }
    }

    window.onload = createParticles;

    function generateVCard() {
        const vCard = [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "FN:Gabriel Knight",
            "TEL:+61422730144",
            "EMAIL:hello@knightlyphotobooth.com.au",
            "END:VCARD"
        ].join("\r\n");

        const blob = new Blob([vCard], {type: 'text/vcard'});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "Gabriel Knight.vcf";
        link.click();
    }
</script>

</body>
</html>
