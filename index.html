<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gabriel Knight | Digital Card</title>
    <meta name="theme-color" content="#0f1412">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --bg-dark: #0f1412; 
            --gold: #dac386; 
            --white: #ffffff; 
            --olive: #847c57; 
            --base-glow: #1d2523;
            --glass: rgba(218, 195, 134, 0.08); 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--white); font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; overflow-x: hidden; position: relative; }
        
        #bg-canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
            background: radial-gradient(circle at center, var(--base-glow) 0%, var(--bg-dark) 100%); 
            pointer-events: none; 
        }

        .particle { position: absolute; background: var(--gold); border-radius: 50%; opacity: 0; pointer-events: none; box-shadow: 0 0 6px var(--gold); }
        @keyframes floatDust { 0% { transform: translateY(10vh) translateX(0); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-110vh) translateX(40px); opacity: 0; } }
        @keyframes rainGlitter { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
        
        .card { width: 100%; max-width: 360px; background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 35px; border: 1px solid rgba(218, 195, 134, 0.3); padding: 22px 20px; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8); text-align: center; position: relative; overflow: hidden; animation: cardEntrance 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .card::after { content: ""; position: absolute; pointer-events: none; z-index: 1; }
        .card::after { top: -50%; left: -100%; width: 25%; height: 200%; background: linear-gradient(to right, transparent, rgba(218, 195, 134, 0.2), transparent); transform: rotate(30deg); animation: sweepRight 6s infinite linear; } @keyframes sweepRight { 0% { left: -100%; } 20% { left: 150%; } 100% { left: 150%; } }
        @keyframes cardEntrance { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .logo-container { margin-bottom: 12px; transition: all 0.5s ease; }
        .main-logo { width: 220px; filter: drop-shadow(0 0 10px rgba(218, 195, 134, 0.3)); transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tagline { font-size: 9px; color: var(--gold); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; }
        
        .coin-wrapper { width: 110px; height: 110px; margin: 0 auto 12px; perspective: 1000px; display: none; }
        .profile-media-container { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateY(0deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 50%; border: 2px solid var(--gold); padding: 3px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .face-front { transform: rotateY(0deg); }
        .face-back { transform: rotateY(180deg); background-image: url('https://raw.githubusercontent.com/theknightlyphotobooth/Images-/01668a04aceed0bceecc35b363e5115693d4dd63/Back.jpg'); background-size: cover; background-position: center; }
        @keyframes coinSpin { 0% { transform: rotateY(0deg); } 58.33% { transform: rotateY(360deg); } 100% { transform: rotateY(360deg); } }
        
        .profile-image { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
        .user-name { font-size: 20px; font-weight: 700; color: var(--white); margin: 10px 0 2px; letter-spacing: 1px; }
        
        .stars-container { display: flex; justify-content: center; gap: 4px; margin: 0 0 10px; height: 20px; align-items: center; }
        .star { color: var(--gold); font-size: 15px; display: inline-block; animation: starWave 2.5s ease-in-out infinite; }
        @keyframes starWave { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-3.5px); } }
        
        .review-text { font-size: 12px; font-style: italic; opacity: 0.8; margin-bottom: 18px; }
        .actions { display: grid; gap: 10px; position: relative; z-index: 2; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; cursor: pointer; border: none; transition: all 0.3s ease; }
        .btn-primary { background: var(--gold); color: var(--bg-dark); box-shadow: 0 10px 30px rgba(218, 195, 134, 0.3); }
        .btn-outline { background: rgba(255, 255, 255, 0.03); color: var(--white); border: 1px solid var(--olive); }
        .btn-save { background: var(--white); color: var(--bg-dark); }
        
        #social-sheet { 
            position: absolute; 
            bottom: -100%; 
            left: 0; 
            width: 100%; 
            background: var(--base-glow); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px); 
            border-top: 1px solid var(--gold); 
            border-radius: 35px 35px 0 0; 
            padding: 30px 20px; 
            z-index: 100; 
            transition: bottom 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            box-shadow: 0 -20px 50px rgba(0,0,0,0.5);
        }
        #social-sheet.active { bottom: 0; }
        .sheet-handle { width: 40px; height: 4px; background: var(--gold); opacity: 0.3; border-radius: 2px; margin: -15px auto 20px; }
        .sheet-title { color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-weight: 700; }
        .close-sheet { position: absolute; top: 20px; right: 20px; color: var(--gold); cursor: pointer; opacity: 0.7; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .footer { margin-top: 15px; font-size: 9px; color: var(--olive); letter-spacing: 2px; }
        .spinner { display: none; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-top: 2px solid #000; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="bg-canvas"></div>
    <div class="card">
        
        <div id="social-sheet">
            <div class="sheet-handle"></div>
            <div class="close-sheet" onclick="toggleSocials()"><i data-lucide="x"></i></div>
            <div class="sheet-title">Connect With Us</div>
            <div class="actions">
                <button onclick="handleNav('https://www.facebook.com/theknightlyphotobooth/')" class="btn btn-outline"><i data-lucide="facebook"></i> Facebook</button>
                <button onclick="handleNav('https://www.instagram.com/theknightlyphotobooth/')" class="btn btn-outline"><i data-lucide="instagram"></i> Instagram</button>
                <button onclick="handleNav('https://www.tiktok.com/@theknightlyphotobooth')" class="btn btn-outline">TikTok</button>
            </div>
        </div>
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/theknightlyphotobooth/Images-/194d47a8ad24d9fef8e9d6f9c3a28f9fad5fc1e5/the%20knightly%20logo.png" class="main-logo">
            <div class="tagline">Luxury Photo Booths</div>
        </div>
        
        <div class="user-name">Gabriel Knight</div>
        <div class="stars-container"><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
        <div class="review-text">"Melbourne's bespoke experience."</div>
        <div class="actions">
            
            <button onclick="generateVCard()" class="btn btn-save" id="saveBtn"><i data-lucide="user-plus" id="saveIcon"></i><div class="spinner" id="saveSpinner"></div>Save Contact</button>
            
            <div class="contact-grid">
                <button onclick="handleNav('tel:+61422730144')" class="btn btn-outline"><i data-lucide="phone"></i> Call</button>
                <button onclick="handleNav('sms:+61422730144')" class="btn btn-outline"><i data-lucide="message-square"></i> SMS</button>
            </div>
            <button onclick="toggleSocials()" class="btn btn-outline"><i data-lucide="share-2"></i> Our Socials</button>
            <button onclick="sendEmail()" class="btn btn-outline"><i data-lucide="mail"></i> Email Us</button>
        </div>
        <div class="footer">Melbourne • Victoria • Australia</div>
    </div>
    <script>
        lucide.createIcons();
        function handleNav(url) { if (url.includes('script.google.com')) { window.top.location.href = url; } else { window.open(url, '_blank'); } }
        function toggleSocials() { document.getElementById('social-sheet').classList.toggle('active'); }
        function createParticles() {
            const mode = "dust"; if (mode === 'none') return;
            const container = document.getElementById('bg-canvas'); 
            const existing = container.querySelectorAll('.particle');
            existing.forEach(e => e.remove());
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                const size = Math.random() * 2 + 1; p.style.width = p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%';
                p.style.animation = (mode === 'dust' ? 'floatDust' : 'rainGlitter') + ' ' + (Math.random() * 5 + 5) + 's linear infinite';
                container.appendChild(p);
            }
        }
        window.onload = createParticles;
        function sendEmail() { handleNav(`mailto:hello@knightlyphotobooth.com.au?subject=Booking Enquiry`); }
        async function generateVCard() {
            const btn = document.getElementById('saveBtn'); const icon = document.getElementById('saveIcon'); const spin = document.getElementById('saveSpinner');
            btn.style.opacity = "0.7"; icon.style.display = "none"; spin.style.display = "block";
            const vCard = ["BEGIN:VCARD", "VERSION:3.0", "FN:Gabriel Knight", "TEL:+61422730144", "EMAIL:hello@knightlyphotobooth.com.au", "END:VCARD"].join("\r\n");
            const blob = new Blob([vCard], {type: 'text/vcard'}); const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = "Gabriel Knight.vcf"; link.click();
            setTimeout(() => { btn.style.opacity = "1"; icon.style.display = "block"; spin.style.display = "none"; }, 1000);
        }
    </script>
</body>
</html>
